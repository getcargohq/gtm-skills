name: validate

# The weekly run is the important one. Slugs and prices live upstream in
# getcargohq/cargo-skills; they can go stale here without anyone touching this
# repo. The cron is what catches a provider repricing before a new user does.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: cargo-skills ref to validate against
        required: false
        default: main

permissions:
  contents: read

jobs:
  validate:
    name: Check every slug and price against the Cargo playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node >= 22.18: validate.ts runs via native type-stripping, no build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Repo tooling only (yaml for the frontmatter parser, prettier, the CDK for
      # typechecking the examples). Nothing in the root package.json ships: a
      # customer's project shell comes from `cargo-ai cdk init`.
      - run: npm ci --ignore-scripts

      - name: Validate the one-off skills against the Cargo playbooks
        env:
          CARGO_SKILLS_REF: ${{ inputs.ref || 'main' }}
        run: node scripts/validate.ts

      # The pipeline skills (folders that carry a worked CDK example): frontmatter
      # parses, the contract sections exist, no relative import escapes the
      # folder, fixed credit amounts are absent, infra templates check and plan,
      # and the to-be-approved banner follows .github/data/approvals.json.
      - name: Validate the pipeline skills
        run: node scripts/check-pipelines.mjs

      - name: Typecheck the pipeline resources
        run: npm run typecheck

      - name: Check llms.txt is in sync with the skill tree
        run: node scripts/generate-llms-txt.ts --check

      - name: Check catalog.json is in sync with the skill tree
        run: node scripts/build-catalog.mjs --check

      # Prettier covers the example TypeScript and repository files except the
      # three generated or legacy scripts listed in .prettierignore.
      - name: Format check
        run: npx prettier --check .

      # The plugin channel's session hooks write this marker into the session
      # row, so a regression here corrupts the attribution numbers silently
      # rather than failing loudly.
      - name: Run the skill-load detector's self-test
        run: bash hooks/skill-loads.sh --self-test

      # The OpenAI directory is the one channel that cannot self-update: every
      # version is a manual, human-reviewed submission. Building the archive on
      # every commit means the rejection is found here rather than a review
      # cycle later. Built into a temp dir — the committed dist/ zip is the
      # artifact that was actually uploaded, and zip timestamps make it
      # pointless to diff.
      - name: Build the OpenAI directory package
        run: node scripts/build-codex-package.mjs --out "$RUNNER_TEMP/codex-package"

      # Hooks run on a stranger's machine with a minimal PATH and no way to
      # report a syntax error. Parse them here instead.
      - name: Parse every hook script
        run: |
          set -euo pipefail
          for hook in hooks/*.sh; do
            bash -n "$hook"
            echo "ok  $hook"
          done

      # The descriptions are the only text an agent sees before deciding which
      # skill to load, and the deliberately adjacent ones compete for every
      # prompt. The ranker lives in the pack; there is no second copy to drift.
      - name: Check the descriptions still route
        uses: actions/checkout@v4
        with:
          repository: getcargohq/cargo-skills
          ref: ${{ inputs.ref || 'main' }}
          path: .cargo-skills

      - run: npm run validate:routing
